<div class="reg-container">
    <main class="reg-content">
        <div class="reg-card">
            <header class="reg-header">
                <div class="logo">
                    <img src="/stable-disperson-icon_paths-white.svg" class="logo-icon">
                    <p>To-Do</p>
                </div>
            </header>

            <h1 class="reg-title">Create an account</h1>
            <p class="reg-subtitle">Start organizing your tasks in one place.</p>

            <form class="reg-form" [formGroup]="regForm" (ngSubmit)="onSubmit()">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" formControlName="name" autocomplete="name" placeholder="Your name" required />
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" formControlName="email" autocomplete="email" placeholder="you@example.com" required />
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Password</label>
                    </div>
                    <input type="password" id="password" name="password" formControlName="password" autocomplete="new-password" placeholder="Create a password" required />
                </div>

                <button type="submit" [disabled]="regForm.invalid" class="btn-submit" >Create account</button>
            </form>

            <p class="reg-footer">
                <span class="footer-text">Already have an account?</span>
                <a href="/login" class="footer-link">Sign in</a>
            </p>
        </div>
    </main>
    <div class="design-context">
        <div class="gradient-first-block"></div>
        <div class="gradient-second-block"></div>
    </div>
</div>
